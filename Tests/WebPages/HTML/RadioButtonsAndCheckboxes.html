<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
    <title>Radio Buttons And Checkboxes</title>
  </head>
   <body>
    <header name="Radio Buttons1">
      <h1>I Love Phosphorus ...</h1>
      <input type="radio" name="answer" id="yes" checked="">
      <span>Yes</span>
      <input type="radio" name="answer" id="no">
      <span>No</span>
    </header>
    <header name="Radio Buttons2">
      <h1>Confirm last field is disabled. Phosphorus ...</h1>
      <input type="radio" name="plan" id="rocks">
      <span>Rocks</span>
      <input type="radio" name="plan" id="reallyrocks">
      <span>Really Rocks</span>
      <input type="radio" name="plan" id="mayberocks" disabled="">
      <span>Maybe Rocks</span>
    </header>
    <header name="Checkbox">
      <h1>Tick the check:</h1>
      <input type="checkbox">
      <span>Phosphorus rocks!</span>
    </header>
  </body>
</html>
